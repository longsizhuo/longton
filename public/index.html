<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Langton's Ant · 朗顿蚂蚁</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --ant: #ff5d5d;
    --cell-on: #e6edf3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 1fr 320px;
    height: 100vh;
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .panel { max-height: 45vh; overflow-y: auto; }
  }
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
  }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stats-3 { grid-template-columns: 1fr 1fr 1fr; }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600;
    color: var(--accent);
  }
  .phase {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .phase-name { color: var(--accent); font-weight: 600; }
  .phase-desc { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { opacity: 0.9; color: #0d1117; }
  label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  input[type="text"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .info {
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .info code {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
  }
  .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="app">
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <aside class="panel">
    <h1>Langton's Ant</h1>
    <div class="subtitle">朗顿蚂蚁 · 一个简单规则的二维图灵机</div>

    <div class="stats stats-3">
      <div class="stat">
        <div class="stat-label">步数</div>
        <div class="stat-value" id="stat-steps">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">蚂蚁</div>
        <div class="stat-value" id="stat-ants">1</div>
      </div>
      <div class="stat">
        <div class="stat-label">上色格</div>
        <div class="stat-value" id="stat-filled">0</div>
      </div>
    </div>

    <div class="phase">
      <div class="phase-name">规则: <span id="rule-display">RL</span></div>
      <div class="phase-desc" id="rule-desc">经典 Langton — 10000 步进入高速公路</div>
    </div>

    <div class="controls">
      <div class="row">
        <button class="primary" id="btn-play">▶ 播放</button>
        <button id="btn-step">单步</button>
      </div>
      <div class="row">
        <button id="btn-reset">重置</button>
        <button id="btn-fit">居中</button>
      </div>

      <div>
        <label>规则字符串</label>
        <select id="rule-preset">
          <option value="">— 预设 —</option>
        </select>
        <div class="row" style="margin-top:6px">
          <input type="text" id="rule-input" value="RL" spellcheck="false" />
          <button id="btn-apply-rule">应用</button>
        </div>
      </div>

      <div>
        <label>蚂蚁</label>
        <div class="row">
          <button id="btn-add-ant">+ 随机添加</button>
          <button id="btn-clear-ants">只留一只</button>
        </div>
      </div>

      <div>
        <label>每帧步数 <span id="speed-val">10</span></label>
        <input type="range" id="speed" min="1" max="2000" value="10" />
      </div>

      <div>
        <label>缩放 <span id="zoom-val">6</span> px/格</label>
        <input type="range" id="zoom" min="1" max="20" value="6" />
      </div>
    </div>

    <div class="info">
      <strong>规则字母</strong><br/>
      <code>L</code> 左转 · <code>R</code> 右转 · <code>F</code> 直走 · <code>U</code> 调头
      <br/><br/>
      <strong>怎么读</strong><br/>
      <code>RL</code> = 颜色 0 时右转，颜色 1 时左转<br/>
      <code>LLRR</code> = 4 种颜色对应 L/L/R/R
      <br/><br/>
      每走过一格，颜色循环到下一种。<br/>
      多只蚂蚁共享一张格子图（快照同步更新）。
      <br/><br/>
      拖动可平移，滚轮缩放。
    </div>
  </aside>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
