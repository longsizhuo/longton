<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Langton's Ant · 朗顿蚂蚁</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #58a6ff;
    --ant: #ff5d5d;
    --cell-on: #e6edf3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    height: 100%;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 1fr 320px;
    height: 100vh;
  }
  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    .panel { max-height: 45vh; overflow-y: auto; }
  }
  .canvas-wrap {
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .panel {
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 20px;
    overflow-y: auto;
  }
  h1 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 600;
  }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .stat-label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-value {
    font-size: 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-weight: 600;
    color: var(--accent);
  }
  .phase {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 16px;
    font-size: 13px;
  }
  .phase-name { color: var(--accent); font-weight: 600; }
  .phase-desc { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; }
  button {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary {
    background: var(--accent);
    color: #0d1117;
    border-color: var(--accent);
    font-weight: 600;
  }
  button.primary:hover { opacity: 0.9; color: #0d1117; }
  label {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }
  .info {
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .info code {
    background: var(--bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 10px;
  }
  .legend { display: flex; gap: 12px; margin-top: 8px; font-size: 11px; }
  .legend span { display: flex; align-items: center; gap: 4px; }
  .swatch {
    width: 10px;
    height: 10px;
    border-radius: 2px;
    display: inline-block;
  }
</style>
</head>
<body>
<div class="app">
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
  </div>

  <aside class="panel">
    <h1>Langton's Ant</h1>
    <div class="subtitle">朗顿蚂蚁 · 一个简单规则的二维图灵机</div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">步数</div>
        <div class="stat-value" id="stat-steps">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">黑格数</div>
        <div class="stat-value" id="stat-black">0</div>
      </div>
    </div>

    <div class="phase">
      <div class="phase-name" id="phase-name">混沌阶段</div>
      <div class="phase-desc" id="phase-desc">前 ~100 步：对称、有规律</div>
    </div>

    <div class="controls">
      <div class="row">
        <button class="primary" id="btn-play">▶ 播放</button>
        <button id="btn-step">单步</button>
      </div>
      <div class="row">
        <button id="btn-reset">重置</button>
        <button id="btn-fit">居中</button>
      </div>

      <div>
        <label>每帧步数 <span id="speed-val">10</span></label>
        <input type="range" id="speed" min="1" max="2000" value="10" />
      </div>

      <div>
        <label>缩放 <span id="zoom-val">6</span> px/格</label>
        <input type="range" id="zoom" min="1" max="20" value="6" />
      </div>

      <div class="legend">
        <span><i class="swatch" style="background:var(--cell-on)"></i>黑格</span>
        <span><i class="swatch" style="background:var(--ant)"></i>蚂蚁</span>
      </div>
    </div>

    <div class="info">
      <strong>规则</strong><br/>
      白格上：右转 90°，翻成黑，前进<br/>
      黑格上：左转 90°，翻成白，前进
      <br/><br/>
      <strong>三个阶段</strong><br/>
      <code>0–100</code> 对称的简单图案<br/>
      <code>100–10000</code> 看似随机的混沌<br/>
      <code>~10000+</code> 突现的"高速公路"周期 104 步
      <br/><br/>
      拖动可平移视图，滚轮缩放。
    </div>
  </aside>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
